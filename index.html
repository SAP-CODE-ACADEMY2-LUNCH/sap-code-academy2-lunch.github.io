<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>오늘 점심? · SAP CODE 점심 지도</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
    />
    <style>
      /* =========================================================
   오늘 점심? — SAP CODE 점심 지도
   위에서부터: 색·글꼴 → 기본 요소 → 버튼·입력 → 도구줄·필터
   → 가게 추가 → 가게 목록 → 좋아요·TOP 3 → 지도 → 애니메이션
   ========================================================= */

      /* ---------- 색·글꼴 ---------- */
      :root {
        --bg: #f6f8f5;
        --surface: #ffffff;
        --sunken: #eef2ee;
        --fg: #1c231f;
        --muted: #5f6b64;
        --line: #dde4df;
        --accent: #03a94f;
        --accent-ink: #ffffff;
        --warn: #b4560f;
        --warn-bg: #fcefe3;
        --danger: #c43b2f;
        --display: "Gothic A1", "Apple SD Gothic Neo", system-ui, sans-serif;
        --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --surface: #1a201d;
          --sunken: #151a17;
          --fg: #e7ede9;
          --muted: #9aa69f;
          --line: #2b332f;
          --accent: #2fd078;
          --accent-ink: #0b1a12;
          --warn: #f0a35e;
          --warn-bg: #33251a;
          --danger: #ff7a6b;
          color-scheme: dark;
        }
      }

      /* ---------- 기본 요소 ---------- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        padding-block: env(safe-area-inset-top, 0px)
          env(safe-area-inset-bottom, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.5;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding-block: 28px 56px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.7rem;
        margin: 0;
        letter-spacing: -0.01em;
      }
      h2 {
        font-family: var(--display);
        font-weight: 800;
        font-size: 1.05rem;
        margin: 0;
      }
      a {
        color: var(--accent);
      }
      .header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .titles {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .subtitle {
        margin: 0;
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.95rem;
      }
      .base {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        color: var(--muted);
      }
      .base a {
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0;
      }
      .banner {
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.9rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      /* ---------- 버튼·입력 ---------- */
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--fg);
      }
      input,
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        width: 100%;
        min-width: 0;
      }
      textarea {
        resize: vertical;
        min-height: 64px;
      }
      select:has(option[value=""]:checked) {
        color: var(--muted);
      }
      select option {
        color: var(--fg);
      }
      /* 비밀번호 칸: type=password 대신 글자만 가려서 브라우저 비밀번호 저장 창이 뜨지 않게 한다 */
      .pw {
        -webkit-text-security: disc;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .btn.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
      }
      .btn.link {
        border: 0;
        background: none;
        padding: 2px 0;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .btn.link:hover {
        color: var(--fg);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .badge {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--warn);
        background: var(--warn-bg);
        border-radius: 4px;
        padding: 0 6px;
        white-space: nowrap;
      }
      .badge.warn {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 10%, var(--surface));
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .msg {
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      .msg.err {
        color: var(--danger);
      }
      .msg.ok {
        color: var(--accent);
      }

      /* ---------- 도구줄·필터 ---------- */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .toolbar .search {
        flex: 1 1 180px;
      }
      .toolbar select {
        width: auto;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        font-size: 0.85rem;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 4px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .chip-n {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
        margin-left: 2px;
      }

      /* 붙어 있는 버튼 묶음 (전체·1기 추천·새로 등록 / 목록·지도) */
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .seg.src {
        align-self: flex-start;
        max-width: 100%;
      }
      .vtab {
        border: 0;
        background: none;
        padding: 4px 14px;
        font-size: 0.85rem;
        cursor: pointer;
        color: var(--muted);
        white-space: nowrap;
      }
      .seg.src .vtab {
        padding: 5px 14px;
      }
      .vtab + .vtab {
        border-left: 1px solid var(--line);
      }
      .vtab[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }

      /* ---------- 가게 추가 ---------- */
      .addbox {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .grid .full {
        grid-column: 1 / -1;
      }
      @media (max-width: 480px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.84rem;
        color: var(--muted);
        min-width: 0;
      }
      .searchrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .searchrow input {
        flex: 1 1 160px;
      }
      .results {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        max-height: 260px;
        overflow-y: auto;
      }
      .result {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0 10px;
        text-align: left;
        padding: 8px 10px;
        border: 0;
        border-top: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .result:first-child {
        border-top: 0;
      }
      .result:hover {
        background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      }
      .result small {
        color: var(--muted);
        grid-column: 1 / -1;
      }
      .picked {
        font-size: 0.88rem;
        background: var(--sunken);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      /* ---------- 가게 목록 ---------- */
      .listbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .count {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .list {
        overflow: hidden;
      }
      .empty {
        padding: 24px 14px;
        text-align: center;
        color: var(--muted);
      }
      .row {
        padding: 12px 14px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .row:first-child {
        border-top: 0;
      }
      .line1,
      .line2 {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }
      .nm {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 6px;
        min-width: 0;
      }
      .name {
        font-weight: 600;
        font-size: 1rem;
        color: inherit;
        text-decoration: none;
        min-width: 0;
      }
      .name:hover {
        color: var(--accent);
      }
      .price {
        font-variant-numeric: tabular-nums;
        font-size: 0.88rem;
        white-space: nowrap;
      }
      .menu {
        color: var(--muted);
        font-size: 0.88rem;
        min-width: 0;
      }
      .dist {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .desc {
        font-size: 0.9rem;
        margin: 4px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        margin-top: 4px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .meta .who {
        margin-right: auto;
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 가게를 펼쳤을 때 나오는 후기·수정·삭제 칸 */
      .panel {
        margin-top: 8px;
        background: var(--sunken);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .reviews {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .review {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .review .rh {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .review p {
        margin: 0;
        font-size: 0.9rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .inline {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .inline input {
        width: auto;
        flex: 1 1 120px;
      }
      .inline .hint {
        flex-basis: 100%;
      }
      .reportline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        font-size: 0.8rem;
        color: var(--muted);
        padding-top: 8px;
        border-top: 1px dashed var(--line);
      }
      .closebox {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 12px;
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
      }
      .closebox .hint {
        flex: 1 1 220px;
      }

      /* ---------- 좋아요·TOP 3 ---------- */
      .like {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 0 9px;
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--muted);
        cursor: pointer;
        font-variant-numeric: tabular-nums;
      }
      .like[aria-pressed="true"] {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
        background: color-mix(in srgb, var(--danger) 8%, var(--surface));
      }
      .like:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .top {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .topgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
      }
      .topcard {
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        min-width: 0;
      }
      .topcard:hover {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      }
      .tc-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .tc-rank {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 0.78rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .tc-name {
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 800;
        min-width: 0;
        margin-right: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tc-heart {
        color: var(--danger);
        white-space: nowrap;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      .tc-sub,
      .tc-by {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .topcard q {
        font-size: 0.9rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
        quotes: "“" "”";
      }

      /* ---------- 지도 ---------- */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right, 0px))
          max(16px, env(safe-area-inset-bottom, 0px))
          max(16px, env(safe-area-inset-left, 0px));
      }
      .modal-back {
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, #000 45%, transparent);
      }
      .modal-panel {
        position: relative;
        width: min(640px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      #mapBox {
        width: 100%;
        height: min(52vh, 420px);
        min-height: 240px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--sunken);
        flex: none;
      }
      #mapRes {
        max-height: 28vh;
      }
      .mapview {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #allMap {
        width: 100%;
        height: min(65vh, 560px);
        min-height: 300px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--sunken);
      }
      .baselabel {
        display: inline-block;
        background: var(--fg);
        color: var(--bg);
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .mapcard {
        position: relative;
        margin-bottom: 46px;
        min-width: 180px;
        max-width: 240px;
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 4px 14px color-mix(in srgb, #000 18%, transparent);
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 0.84rem;
        line-height: 1.4;
        white-space: normal;
      }
      .mapcard .name {
        font-size: 0.95rem;
        padding-right: 18px;
      }
      .mapcard .menu,
      .mapcard .dist {
        font-size: 0.8rem;
      }
      .mapcard .mc-actions {
        display: flex;
        gap: 12px;
        margin-top: 4px;
      }
      .mapcard .x {
        position: absolute;
        top: 4px;
        right: 6px;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        padding: 2px;
      }

      /* ---------- 애니메이션 ---------- */
      .row.flash {
        animation: flash 2.5s ease-out;
      }
      @keyframes flash {
        0%,
        40% {
          background: color-mix(in srgb, var(--accent) 22%, var(--surface));
        }
        100% {
          background: var(--surface);
        }
      }
      @keyframes fade {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .panel {
          animation: fade 0.15s ease-out;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .row.flash {
          animation: none;
          background: color-mix(in srgb, var(--accent) 15%, var(--surface));
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <div class="titles">
          <h1>오늘 점심?</h1>
          <p class="subtitle">SAP CODE ACADEMY 전포동 점심 지도</p>
        </div>
        <div class="base">
          <span id="baseLabel"></span
          ><a id="baseLink" target="_blank" rel="noopener"
            >네이버 지도에서 보기</a
          >
        </div>
        <p class="hint">
          가게 이름을 누르면 네이버 지도 검색이 열려요. 거리는 기준 위치에서 잰
          직선거리예요. 누구나 가게를 추가하고 후기를 남길 수 있어요. 글을 쓸 때
          정한 비밀번호로 수정·삭제할 수 있어요.
        </p>
      </header>

      <div class="banner" id="setupBanner" hidden></div>

      <section class="top" id="topBox" hidden aria-labelledby="topTitle">
        <h2 id="topTitle">인기 가게 TOP 3</h2>
        <div class="topgrid" id="topList"></div>
      </section>

      <div class="toolbar">
        <input
          class="search"
          id="q"
          type="search"
          placeholder="가게·메뉴 검색"
          aria-label="가게·메뉴 검색"
        />
        <select id="sort" aria-label="정렬">
          <option value="dist">거리순</option>
          <option value="name">이름순</option>
          <option value="priceAsc">가격 낮은 순</option>
          <option value="priceDesc">가격 높은 순</option>
          <option value="likes">좋아요 많은 순</option>
          <option value="reviews">후기 많은 순</option>
          <option value="recent">최근 추가순</option>
        </select>
        <button
          class="btn primary"
          id="toggleAdd"
          type="button"
          aria-expanded="false"
        >
          + 가게 추가
        </button>
      </div>
      <div
        class="seg src"
        id="srcSeg"
        role="group"
        aria-label="추천 구분"
        hidden
      ></div>
      <div class="chips" id="chips" role="group" aria-label="종류 필터"></div>

      <section class="card addbox" id="addBox" hidden>
        <h2>가게 추가</h2>
        <form id="addForm" class="grid" autocomplete="off">
          <div class="f full">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script>
      // =========================================================
      // 1. 설정
      // Supabase: Project Settings > API 의 Project URL / anon public key
      // Kakao: developers.kakao.com > 내 애플리케이션 > 앱 키 > JavaScript 키 (비워 두면 가게 이름만 직접 입력)
      // =========================================================
      const CONFIG = {
        SUPABASE_URL: "https://kxejoncultswixtxhzxs.supabase.co",
        SUPABASE_ANON_KEY:
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZWpvbmN1bHRzd2l4dHhoenhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTMwNDUsImV4cCI6MjEwODYyOTA0NX0.snHt5p5hV2TbRrzel5QfY_97W_gNvT4bbGnIAcZK3QU",
        KAKAO_JS_KEY: "695807c1ce3a1501057bbe08a465b704",
        BASE: {

          lng: 129.0649739,
          label: "기준 위치 전포대로 207 (텐스)",

        },
      };
      const CATEGORIES = [
        "한식",
        "중식·대만",
        "일식",
        "양식",
        "패스트푸드",
        "아시아",
        "분식",
        "샐러드·샌드위치",
        "카페·빵",
        "기타",
      ];
      const ALL = "전체";

      // 정렬: 값은 <select id="sort">의 option value와 같아야 한다
      const SORTS = {
        dist: (a, b) => cmp(a, b, "d", 1) || cmp(a, b, "price", 1),
        name: (a, b) => a.name.localeCompare(b.name, "ko"),
        priceAsc: (a, b) => cmp(a, b, "price", 1) || cmp(a, b, "d", 1),
        priceDesc: (a, b) => cmp(a, b, "price", -1) || cmp(a, b, "d", 1),
        likes: (a, b) =>
          cmp(a, b, "like_count", -1) ||
          cmp(a, b, "review_count", -1) ||
          cmp(a, b, "d", 1),
        reviews: (a, b) => cmp(a, b, "review_count", -1) || cmp(a, b, "d", 1),
        recent: (a, b) => cmp(a, b, "created_at", -1),
      };

      // 카카오 분류(예: "음식점 > 일식 > 돈까스,우동")를 우리 종류에 맞춘다. 위에서부터 처음 맞는 규칙을 쓴다
      const KAKAO_CATEGORY_RULES = [
        ["샐러드·샌드위치", ["샐러드", "샌드위치"]],
        ["패스트푸드", ["패스트푸드", "햄버거"]],
        ["아시아", ["아시아", "태국", "베트남", "인도", "동남아"]],
        ["중식·대만", ["중식", "중국", "대만"]],
        ["일식", ["일식", "돈까스", "초밥", "라멘", "우동"]],
        ["카페·빵", ["카페", "제과", "베이커리", "디저트", "간식"]],
        ["분식", ["분식", "김밥", "떡볶이"]],
        ["양식", ["양식", "피자", "이탈리안", "스테이크", "패밀리레스토랑"]],
        [
          "한식",
          [
            "한식",
            "국밥",
            "해장국",
            "칼국수",
            "냉면",
            "백반",
            "닭갈비",
            "족발",
          ],
        ],

      // 닉네임을 비워 두면 "형용사 명사"로 지어 준다 (예: 배고픈 만두)
      const NICK_ADJ = [
        "배고픈",
        "든든한",
        "졸린",
        "바쁜",
        "느긋한",
        "수줍은",
        "용감한",
        "성실한",
        "신난",
        "조용한",
        "다정한",
        "까다로운",
        "부지런한",
        "출출한",
        "행복한",
        "엉뚱한",
        "꼼꼼한",
        "씩씩한",
        "포근한",
        "날쌘",
      ];
      const NICK_NOUN = [
        "만두",
        "국밥",
        "김밥",
        "떡볶이",
        "돈까스",
        "라멘",
        "우동",
        "짬뽕",
        "비빔밥",
        "칼국수",
        "고양이",
        "다람쥐",
        "판다",
        "펭귄",
        "수달",
        "햄스터",
        "부엉이",
        "너구리",
        "토끼",
        "코알라",
      ];

      // =========================================================
      // 2. 작은 도구
      // =========================================================
      const $ = (id) => document.getElementById(id);
      const esc = (t) =>
        String(t ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const naverUrl = (name) =>
        "https://map.naver.com/p/search/" +
        encodeURIComponent(/서면|전포/.test(name) ? name : name + " 전포");
      const won = (n) => (n == null ? "" : n.toLocaleString("ko-KR") + "원");
      const fmtD = (d) =>
        d == null
          ? "위치 정보 없음"
          : d === 0
            ? "같은 건물"
            : d < 1000
              ? `${d}m`
              : `${(d / 1000).toFixed(1)}km`;
      const fmtDate = (s) => {
        const d = new Date(s);
        return `${d.getMonth() + 1}.${d.getDate()}`;
      };
      const toNum = (v) =>
        v === "" || v == null ? null : Math.max(0, Math.round(Number(v)));
      const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
      const randomNick = () => `${pickOne(NICK_ADJ)} ${pickOne(NICK_NOUN)}`;
      const errText = (e) =>
        e?.message ||
        e?.error_description ||
        "알 수 없는 오류가 났어요. 잠시 후 다시 시도해 주세요.";

      // 받침에 맞는 조사: josa("국밥", EUL) → "을", josa("피자", EUL) → "를". 한글이 아니면 "을(를)"
      const EUL = ["을", "를", "을(를)"];
      const RO = ["으로", "로", "(으)로"];
      function josa(word, [withFinal, withoutFinal, unknown]) {
        const text = String(word).trim();
        const code = text.charCodeAt(text.length - 1) - 0xac00;
        if (!(code >= 0 && code <= 11171)) return unknown;
        const final = code % 28;
        if (withFinal === "으로" && final === 8) return withoutFinal; // ㄹ 받침은 "로" (예: 서울로)
        return final ? withFinal : withoutFinal;
      }

      // 기준 위치에서 잰 직선거리 (m, 10m 단위)
      function meters(lat, lng) {
        if (lat == null || lng == null) return null;
        const R = 6371000,
          rad = Math.PI / 180,
          B = CONFIG.BASE;
        const dLat = (lat - B.lat) * rad,
          dLng = (lng - B.lng) * rad;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(B.lat * rad) * Math.cos(lat * rad) * Math.sin(dLng / 2) ** 2;
        return Math.round((2 * R * Math.asin(Math.sqrt(a))) / 10) * 10;
      }

      function cmp(a, b, key, dir) {
        const x = a[key],
          y = b[key];
        if (x == null && y == null) return 0;
        if (x == null) return 1; // 값이 없는 가게는 항상 맨 뒤
        if (y == null) return -1;
        return (x < y ? -1 : x > y ? 1 : 0) * dir;
      }

      function setMsg(el, text, ok) {
        if (!el) return;
        el.textContent = text;
        el.className = "msg " + (ok ? "ok" : "err");
      }

      // 목록의 한 가게로 스크롤하고 배경을 잠깐 초록색으로 깜빡인다
      function flashRow(id) {
        const row = document.querySelector(`.row[data-id="${id}"]`);
        if (!row) return;
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        row.scrollIntoView({
          block: "center",
          behavior: calm ? "auto" : "smooth",
        });
        row.classList.remove("flash");
        void row.offsetWidth; // 같은 가게를 연달아 강조할 때 애니메이션을 다시 시작
        row.classList.add("flash");
        setTimeout(() => row.classList.remove("flash"), 2600);
      }

      // =========================================================
      // 3. 브라우저 저장 (이 브라우저에서만 쓰는 편의 기능. 진짜 기록은 DB에 있다)
      // =========================================================
      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {
            /* 저장이 막힌 브라우저면 그냥 넘어간다 */
          }
        },
      };

      // id 목록을 localStorage에 들고 있는 Set. mark(id, true/false)를 부르면 바로 저장된다
      function storedSet(key) {
        let set;
        try {
          set = new Set(JSON.parse(store.get(key) || "[]"));
        } catch (e) {
          set = new Set();
        }
        return {
          has: (id) => set.has(id),
          mark(id, on) {
            if (on) set.add(id);
            else set.delete(id);
            store.set(key, JSON.stringify([...set]));
          },
        };
      }
      const likedReviews = storedSet("liked"); // 좋아요 누른 후기 (버튼 색 표시용)
      const likedStores = storedSet("likedStores"); // 좋아요 누른 가게
      const reportedStores = storedSet("reported"); // 폐업 제보한 가게

      // 로그인이 없으니 브라우저마다 의미 없는 무작위 값을 하나 만들어 좋아요·제보 중복 방지에만 쓴다
      const voterId = (() => {
        let v = store.get("voter");
        if (!v || v.length < 8) {
          v =
            crypto.randomUUID?.() ||
            Date.now().toString(36) +
              Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2);
          store.set("voter", v);
        }
        return v;
      })();

      // =========================================================
      // 4. 화면 상태
      // =========================================================
      const state = {
        rows: [], // 영업 중인 가게 전체 (+ d: 기준 위치에서 거리)
        cat: store.get("cat") || ALL,
        src: store.get("src") || "all", // 추천 구분: "all" | "new"(새로 등록) | 추천 묶음 이름(예: "SAP CODE 1기 추천")
        sort: Object.hasOwn(SORTS, store.get("sort") ?? "")
          ? store.get("sort")
          : "dist",
        q: "",
        view: "list", // "list" | "map". 지도는 카카오가 준비된 뒤에만 켤 수 있다
        open: null, // 펼친 가게: { id, mode: "reviews" | "edit" | "del" }
        reviewDel: null, // 삭제 비밀번호 칸을 연 후기 id
        reviews: new Map(), // 가게 id → 후기 목록
        topQuotes: new Map(), // TOP 3 가게 id → 대표 후기
        picked: null, // 카카오에서 고른 장소
        kakaoResults: [], // 가게 이름 검색 결과
      };

      function setCat(c) {
        state.cat = c;
        store.set("cat", c);
      }
      function setSrc(s) {
        state.src = s;
        store.set("src", s);
      }
      // 특정 가게를 보여 주기 전에 필터를 푼다. keepNew면 '새로 등록' 탭은 그대로 둔다 (방금 등록한 가게가 보이니까)
      function clearFilters({ keepNew = false } = {}) {
        state.q = "";
        $("q").value = "";
        setCat(ALL);
        if (!(keepNew && state.src === "new")) setSrc("all");
      }

      // =========================================================
      // 5. 데이터 (Supabase)
      // 읽기는 뷰(restaurant_list, review_list), 쓰기는 모두 DB 함수(rpc)로 한다
      // =========================================================
      const configured = !/YOUR-/.test(
        CONFIG.SUPABASE_URL + CONFIG.SUPABASE_ANON_KEY,
      );
      const sb = configured
        ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
        : null;

      async function rpc(fn, args) {
        const { data, error } = await sb.rpc(fn, args);
        if (error) throw error;
        return Array.isArray(data) ? data[0] : data; // RETURNS TABLE 함수는 한 줄짜리 배열로 온다
      }

      async function loadRows() {
        const { data, error } = await sb.from("restaurant_list").select("*");
        if (error) throw error;
        state.rows = data.map((r) => ({ ...r, d: meters(r.lat, r.lng) }));
      }

      // 후기는 좋아요 많은 순, 같으면 최신 순
      function reviewQuery() {
        return sb
          .from("review_list")
          .select("*")
          .order("like_count", { ascending: false })
          .order("created_at", { ascending: false });
      }
      async function loadReviews(id) {
        const { data, error } = await reviewQuery().eq("restaurant_id", id);
        if (error) throw error;
        state.reviews.set(id, data);
      }
      // TOP 3 카드에 보여 줄 대표 후기: 그 가게에서 좋아요가 가장 많은 것
      async function loadTopQuotes() {
        const ids = topStores().map((r) => r.id);
        state.topQuotes = new Map();
        if (!ids.length) return;
        const { data, error } = await reviewQuery().in("restaurant_id", ids);
        if (error) return; // 대표 후기는 없어도 카드는 보여 줄 수 있다
        for (const v of data) {
          if (!state.topQuotes.has(v.restaurant_id))
            state.topQuotes.set(v.restaurant_id, v);
        }
      }

      async function refresh() {
        await loadRows();
        await loadTopQuotes();
        render();
      }

      // =========================================================
      // 6. 목록 계산
      // =========================================================
      const srcMatch = (r) =>
        state.src === "all" ||
        (state.src === "new" ? !r.collection : r.collection === state.src);
      const collections = () => [
        ...new Set(state.rows.map((r) => r.collection).filter(Boolean)),
      ];
      const shortCol = (c) => c.replace(/^SAP\s*CODE\s*/i, ""); // "SAP CODE 1기 추천" → "1기 추천"

      function visibleRows() {
        const q = state.q.trim().toLowerCase();
        return state.rows
          .filter((r) => state.cat === ALL || r.category === state.cat)
          .filter(srcMatch)
          .filter(
            (r) =>
              !q ||
              [r.name, r.menu, r.description]
                .join(" ")
                .toLowerCase()
                .includes(q),
          )
          .sort(SORTS[state.sort]);
      }

      // 인기 가게 TOP 3: 좋아요 1개 이상인 가게 중 좋아요 → 후기 수 → 거리 순
      function topStores() {
        return state.rows
          .filter((r) => (r.like_count || 0) > 0)
          .sort(
            (a, b) =>
              cmp(a, b, "like_count", -1) ||
              cmp(a, b, "review_count", -1) ||
              cmp(a, b, "d", 1),
          )
          .slice(0, 3);
      }

      // =========================================================
      // 7. HTML 조각
      // =========================================================
      const colBadge = (r) =>
        r.collection
          ? `<span class="badge" title="${esc(r.collection)}">${esc(shortCol(r.collection))}</span>`
          : "";
      const reportBadge = (r) =>
        r.report_count > 0
          ? `<span class="badge warn" title="관리자가 확인하면 목록에서 숨겨져요">폐업 제보 ${r.report_count}건</span>`
          : "";
      const menuLine = (r) =>
        esc(r.category) + (r.menu ? " · " + esc(r.menu) : "");
      const pwInput = (attrs) =>
        `<input type="text" class="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${attrs}>`;
      const likeButton = (attrs, count, pressed, what) =>
        `<button class="like" type="button" ${attrs} aria-pressed="${pressed}" aria-label="${what} ${count}개${pressed ? ", 누름" : ""}">♥ ${count}</button>`;

      // sel이 비어 있으면 맨 앞에 "선택하세요"를 넣는다. 그대로 등록하면 ""가 넘어가고 DB가 '기타'로 저장한다
      function catOptions(sel) {
        const list =
          !sel || CATEGORIES.includes(sel) ? CATEGORIES : [...CATEGORIES, sel];
        const placeholder = sel
          ? ""
          : `<option value="" disabled selected>선택하세요</option>`;
        return (
          placeholder +
          list
            .map(
              (c) =>
                `<option${c === sel ? " selected" : ""}>${esc(c)}</option>`,
            )
            .join("")
        );
      }

      function reviewItem(v) {
        const count = v.like_count ?? 0;
        return `
    <li class="review">
      <span class="rh">
        <b>${esc(v.nickname)}</b><span>${fmtDate(v.created_at)}</span>
        ${likeButton(`data-act="like" data-rid="${v.id}"`, count, likedReviews.has(v.id), "좋아요")}
        <button class="btn link" type="button" data-act="revdel" data-rid="${v.id}">삭제</button>
      </span>
      <p>${esc(v.content)}</p>
      ${
        state.reviewDel === v.id
          ? `
      <form class="inline" data-form="revdel" data-rid="${v.id}">
        ${pwInput(`name="password" id="rd_pw_${v.id}" placeholder="후기 비밀번호" required aria-label="후기 비밀번호"`)}
        <button class="btn danger" type="submit">삭제</button>
        <button class="btn" type="button" data-act="revdelcancel">취소</button>
        <span class="msg"></span>
      </form>`
          : ""
      }
    </li>`;
      }

      function reviewsPanel(r) {
        const list = state.reviews.get(r.id);
        const items =
          list == null
            ? `<li class="hint">불러오는 중…</li>`
            : !list.length
              ? `<li class="hint">아직 후기가 없어요. 첫 후기를 남겨 주세요.</li>`
              : list.map(reviewItem).join("");
        const reported = reportedStores.has(r.id);
        return `
    <ul class="reviews">${items}</ul>
    <form class="grid" data-form="review" autocomplete="off">
      <label class="f full">후기<textarea name="content" id="rv_c_${r.id}" maxlength="300" required placeholder="웨이팅 20분, 츠케멘 양 많아요"></textarea></label>
      <label class="f">닉네임<input name="nickname" id="rv_n_${r.id}" maxlength="20" autocomplete="off" placeholder="비워 두면 자동으로 지어져요" value="${esc(store.get("nick") || "")}"></label>
      <label class="f">비밀번호 (4자 이상)${pwInput(`name="password" id="rv_p_${r.id}" minlength="4" required`)}</label>
      <div class="actions full"><button class="btn primary" type="submit">후기 남기기</button><span class="msg"></span></div>
    </form>
    <div class="reportline">
      <span>${reported ? "폐업 제보를 보냈어요." : "이 가게가 문을 닫았나요?"}</span>
      <button class="btn link" type="button" data-act="report" aria-pressed="${reported}">${reported ? "제보 취소" : "폐업 제보하기"}</button>
    </div>`;
      }

      function editPanel(r) {
        return `
    <form class="grid" data-form="edit" autocomplete="off">
      <label class="f">종류<select name="category">${catOptions(r.category)}</select></label>
      <label class="f">대표 가격 (원)<input name="price" type="number" min="0" step="100" value="${r.price ?? ""}"></label>
      <label class="f full">추천 메뉴<input name="menu" maxlength="100" value="${esc(r.menu || "")}"></label>
      <label class="f full">한줄 설명<textarea name="description" maxlength="300">${esc(r.description || "")}</textarea></label>
      <label class="f full">등록할 때 정한 비밀번호${pwInput(`name="password" id="e_pw_${r.id}" required`)}</label>
      <div class="actions full">
        <button class="btn primary" type="submit">저장</button>
        <button class="btn" type="button" data-act="close">취소</button>
        <span class="msg"></span>
      </div>
      <div class="closebox full">
        <span class="hint">폐업한 가게라면 관리자 비밀번호를 위 칸에 넣고 폐업 처리하세요. 목록·지도에서 숨겨지고 후기는 보관돼요.</span>
        <button class="btn danger" type="submit" data-close="1">폐업 처리</button>
      </div>
    </form>`;
      }

      function deletePanel(r) {
        return `
    <form class="inline" data-form="del">
      <span class="hint">가게와 후기 ${r.review_count}개가 함께 지워져요.</span>
      ${pwInput(`name="password" id="d_pw_${r.id}" placeholder="등록할 때 정한 비밀번호" required aria-label="비밀번호"`)}
      <button class="btn danger" type="submit">삭제</button>
      <button class="btn" type="button" data-act="close">취소</button>
      <span class="msg"></span>
    </form>`;
      }

      const PANELS = {
        reviews: reviewsPanel,
        edit: editPanel,
        del: deletePanel,
      };

      function rowHtml(r) {
        const open = state.open?.id === r.id ? state.open.mode : null;
        return `
    <article class="row" data-id="${r.id}">
      <div class="line1">
        <span class="nm"><a class="name" href="${naverUrl(r.name)}" target="_blank" rel="noopener">${esc(r.name)}</a>${colBadge(r)}${reportBadge(r)}</span>
        <span class="price">${r.price != null ? won(r.price) : "가격 정보 없음"}</span>
      </div>
      <div class="line2"><span class="menu">${menuLine(r)}</span><span class="dist">${fmtD(r.d)}</span></div>
      ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ""}
      <div class="meta">
        <span class="who">${esc(r.nickname)} · ${fmtDate(r.created_at)}</span>
        ${likeButton(`data-act="slike"`, r.like_count || 0, likedStores.has(r.id), "가게 좋아요")}
        <button class="btn link" type="button" data-act="reviews" aria-expanded="${open === "reviews"}">후기 ${r.review_count}</button>
        <button class="btn link" type="button" data-act="edit">수정</button>
        <button class="btn link" type="button" data-act="del">삭제</button>
      </div>
      ${open ? `<div class="panel">${PANELS[open](r)}</div>` : ""}
    </article>`;
      }

      function topCardHtml(r, i) {
        const q = state.topQuotes.get(r.id);
        const tags = colBadge(r) + reportBadge(r);
        return `
    <button class="topcard" type="button" data-rid="${r.id}">
      <span class="tc-head">
        <span class="tc-rank">${i + 1}</span>
        <b class="tc-name">${esc(r.name)}</b>
        <span class="tc-heart">♥ ${r.like_count}</span>
      </span>
      ${tags ? `<span class="tags">${tags}</span>` : ""}
      <span class="tc-sub">${menuLine(r)} · ${fmtD(r.d)}</span>
      ${q ? `<q>${esc(q.content)}</q><span class="tc-by">${esc(q.nickname)} · 후기 ${r.review_count}개</span>` : ""}
    </button>`;
      }

      // 카카오 장소 검색 결과 한 줄
      const kakaoPath = (p) =>
        (p.category_name || "").split(" > ").slice(1).join(" > ");
      const placeRow = (distText) => (p, i) => `
  <button class="result" type="button" data-i="${i}">
    <span>${esc(p.place_name)}</span><span class="dist">${distText(p)}</span>
    <small>${esc(p.road_address_name || p.address_name)} · ${esc(kakaoPath(p))}</small>
  </button>`;
      const resultHint = (text) =>
        `<div class="result"><span class="hint">${esc(text)}</span></div>`;

      // =========================================================
      // 8. 그리기
      // =========================================================
      function render() {
        renderSrc(); // 추천 구분을 먼저 확정해야 종류별 숫자를 셀 수 있다
        renderChips();
        renderList();
        renderTop();
      }

      // 추천 구분 버튼: [전체] [★ 1기 추천] [새로 등록]. 추천 묶음이 하나도 없으면 줄을 숨긴다
      function renderSrc() {
        const cols = collections();
        const box = $("srcSeg");
        box.hidden = !cols.length;
        if (
          !cols.length ||
          (state.src !== "all" &&
            state.src !== "new" &&
            !cols.includes(state.src))
        )
          state.src = "all";
        if (!cols.length) return;

        const opts = [
          { v: "all", label: "전체", n: state.rows.length },
          ...cols.map((c) => ({
            v: c,
            label: "★ " + shortCol(c),
            n: state.rows.filter((r) => r.collection === c).length,
          })),
          {
            v: "new",
            label: "새로 등록",
            n: state.rows.filter((r) => !r.collection).length,
          },
        ];
        box.innerHTML = opts
          .map(
            (o) => `
    <button class="vtab" type="button" data-src="${esc(o.v)}" aria-pressed="${o.v === state.src}">
      ${esc(o.label)} <span class="chip-n">${o.n}</span>
    </button>`,
          )
          .join("");
      }

      // 종류 칩: 지금 고른 추천 구분 안에서 가게가 있는 종류만, 가게 수와 함께 보여 준다 (검색어와는 상관없음)
      function renderChips() {
        if (
          state.cat !== ALL &&
          !state.rows.some((r) => r.category === state.cat)
        )
          state.cat = ALL;
        const base = state.rows.filter(srcMatch);
        const count = (c) =>
          (c === ALL ? base : base.filter((r) => r.category === c)).length;
        // 지금 고른 종류는 0곳이 되어도 남겨 둬서, 구분을 바꿨을 때 선택이 갑자기 풀리지 않게 한다
        const has = (c) =>
          c === state.cat || base.some((r) => r.category === c);
        const cats = [
          ...new Set([
            ALL,
            ...CATEGORIES.filter(has),
            ...base.map((r) => r.category),
            state.cat,
          ]),
        ];

        $("chips").innerHTML = cats
          .map(
            (c) => `
    <button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">
      ${esc(c)} <span class="chip-n">${count(c)}</span>
    </button>`,
          )
          .join("");
      }

      function renderList() {
        const rows = visibleRows();
        $("count").textContent =
          `${rows.length}곳` +
          (rows.length !== state.rows.length
            ? ` / 전체 ${state.rows.length}곳`
            : "");
        if (state.view === "map") updateAllMap(); // 지도 보기 중이면 필터·검색 결과를 지도에도 반영

        if (rows.length) {
          $("list").innerHTML = rows.map(rowHtml).join("");
          return;
        }
        const firstAdd = "'+ 가게 추가'로 첫 가게를 올려 주세요.";
        const why = !state.rows.length
          ? "아직 등록된 가게가 없어요. " + firstAdd
          : state.src === "new" && !state.rows.some((r) => !r.collection)
            ? "아직 새로 등록된 가게가 없어요. " + firstAdd
            : "조건에 맞는 가게가 없어요.";
        $("list").innerHTML = `<div class="empty">${esc(why)}</div>`;
      }

      function renderTop() {
        const items = topStores();
        $("topBox").hidden = !items.length;
        $("topList").innerHTML = items.map(topCardHtml).join("");
      }

      // =========================================================
      // 9. 목록 동작 (필터·가게 펼치기·좋아요·제보·글 쓰기)
      // =========================================================
      $("chips").addEventListener("click", (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        setCat(b.dataset.cat);
        render();
      });
      $("srcSeg").addEventListener("click", (e) => {
        const b = e.target.closest("[data-src]");
        if (!b) return;
        setSrc(b.dataset.src);
        render();
      });
      $("q").addEventListener("input", (e) => {
        state.q = e.target.value;
        renderList();
      });
      $("sort").value = state.sort;
      $("sort").addEventListener("change", (e) => {
        state.sort = e.target.value;
        store.set("sort", state.sort);
        renderList();
      });

      // 가게의 후기·수정·삭제 칸을 연다. 이미 열린 칸을 다시 누르면 닫는다
      async function togglePanel(id, mode) {
        const same = state.open?.id === id && state.open.mode === mode;
        state.open = same ? null : { id, mode };
        state.reviewDel = null;
        renderList();
        if (same) return;
        if (mode === "reviews") await showReviews(id);
        if (mode === "del") $("d_pw_" + id)?.focus();
      }
      async function showReviews(id) {
        try {
          await loadReviews(id);
        } catch (err) {
          state.reviews.set(id, []);
        }
        renderList();
      }

      // 인기 가게를 누르면: 필터를 풀고 목록에서 그 가게의 후기를 펼쳐 보여 준다
      async function goToReviews(id) {
        clearFilters();
        if (state.view !== "list") setView("list");
        state.open = { id, mode: "reviews" };
        state.reviewDel = null;
        render();
        flashRow(id);
        await showReviews(id);
      }
      $("topList").addEventListener("click", (e) => {
        const b = e.target.closest(".topcard");
        if (b) goToReviews(Number(b.dataset.rid));
      });

      // 좋아요·폐업 제보: 누를 때마다 켜고 끄는 공통 흐름
      async function toggleVote(button, fn, args, apply) {
        button.disabled = true;
        try {
          apply(await rpc(fn, { ...args, p_voter: voterId }));
          if (fn !== "toggle_closed_report") await loadTopQuotes(); // TOP 3나 대표 후기가 바뀔 수 있어서
          renderTop();
          renderList();
        } catch (err) {
          button.disabled = false;
          button.title = errText(err);
        }
      }
      const rowById = (id) => state.rows.find((r) => r.id === id);

      const LIST_ACTIONS = {
        reviews: (id) => togglePanel(id, "reviews"),
        edit: (id) => togglePanel(id, "edit"),
        del: (id) => togglePanel(id, "del"),
        close() {
          state.open = null;
          renderList();
        },
        revdel(id, b) {
          state.reviewDel = Number(b.dataset.rid);
          renderList();
          $("rd_pw_" + b.dataset.rid)?.focus();
        },
        revdelcancel() {
          state.reviewDel = null;
          renderList();
        },
        like(id, b) {
          const rid = Number(b.dataset.rid);
          return toggleVote(b, "toggle_like", { p_review_id: rid }, (out) => {
            likedReviews.mark(rid, out.liked);
            const v = state.reviews.get(id)?.find((x) => x.id === rid);
            if (v) v.like_count = out.like_count;
          });
        },
        slike(id, b) {
          return toggleVote(
            b,
            "toggle_restaurant_like",
            { p_restaurant_id: id },
            (out) => {
              likedStores.mark(id, out.liked);
              const r = rowById(id);
              if (r) r.like_count = out.like_count;
            },
          );
        },
        report(id, b) {
          return toggleVote(
            b,
            "toggle_closed_report",
            { p_restaurant_id: id },
            (out) => {
              reportedStores.mark(id, out.reported);
              const r = rowById(id);
              if (r) r.report_count = out.report_count;
            },
          );
        },
      };
      $("list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        LIST_ACTIONS[b.dataset.act]?.(Number(b.closest(".row").dataset.id), b);
      });

      // 폼 제출: 성공하면 목록을 다시 불러온다. 실패하면 폼 안에 오류를 보여 준다
      const FORM_ACTIONS = {
        async review(id, f) {
          const typed = f.elements.nickname.value.trim();
          await rpc("add_review", {
            p_restaurant_id: id,
            p_nickname: typed || randomNick(),
            p_content: f.elements.content.value,
            p_password: f.elements.password.value,
          });
          if (typed) store.set("nick", typed);
          await loadReviews(id);
        },
        async revdel(id, f) {
          await rpc("delete_review", {
            p_id: Number(f.dataset.rid),
            p_password: f.elements.password.value,
          });
          state.reviewDel = null;
          await loadReviews(id);
        },
        async edit(id, f, btn) {
          const el = f.elements;
          if (btn.dataset.close) {
            await rpc("set_closed", {
              p_id: id,
              p_password: el.password.value,
              p_closed: true,
            });
            reportedStores.mark(id, false);
          } else {
            await rpc("update_restaurant", {
              p_id: id,
              p_password: el.password.value,
              p_category: el.category.value,
              p_menu: el.menu.value,
              p_price: toNum(el.price.value),
              p_description: el.description.value,
            });
          }
          state.open = null;
        },
        async del(id, f) {
          await rpc("delete_restaurant", {
            p_id: id,
            p_password: f.elements.password.value,
          });
          state.open = null;
          state.reviews.delete(id);
        },
      };
      $("list").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const id = Number(f.closest(".row").dataset.id);
        const btn = e.submitter || f.querySelector("button[type=submit]");

        // 폐업 처리는 실수 방지로 두 번 눌러야 실행
        const closing = Boolean(btn.dataset.close);
        if (closing && !btn.dataset.armed) {
          btn.dataset.armed = "1";
          btn.textContent = "한 번 더 누르면 폐업 처리";
          return;
        }

        btn.disabled = true;
        try {
          await FORM_ACTIONS[f.dataset.form](id, f, btn);
          await refresh();
        } catch (err) {
          setMsg(f.querySelector(".msg"), errText(err));
          btn.disabled = false;
          if (closing) {
            delete btn.dataset.armed;
            btn.textContent = "폐업 처리";
          }
        }
      });

      // =========================================================
      // 10. 가게 추가
      // =========================================================
      function resetCategory(sel = "") {
        $("a_cat").innerHTML = catOptions(sel);
      }
      function toggleAdd(open) {
        $("addBox").hidden = !open;
        $("toggleAdd").setAttribute("aria-expanded", String(open));
        $("addMsg").textContent = ""; // 열고 닫을 때 이전 안내 문구 지우기
        if (open) $("a_name").focus();
      }
      $("toggleAdd").addEventListener("click", () =>
        toggleAdd($("addBox").hidden),
      );
      $("cancelAdd").addEventListener("click", () => toggleAdd(false));

      // 고른 뒤에 이름을 고치면 위치 선택을 푼다 (다른 가게 좌표가 붙지 않게)
      $("a_name").addEventListener("input", () => {
        if (state.picked && $("a_name").value !== state.picked.name)
          clearPicked();
      });

      $("addForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target,
          el = f.elements,
          p = state.picked;
        const btn = f.querySelector("button[type=submit]");
        btn.disabled = true;
        try {
          const typed = el.nickname.value.trim();
          const nick = typed || randomNick();
          const name = el.name.value.trim();
          const newId = await rpc("add_restaurant", {
            p_name: name,
            p_category: el.category.value,
            p_menu: el.menu.value,
            p_price: toNum(el.price.value),
            p_description: el.description.value,
            p_address: p?.address ?? null,
            p_lat: p?.lat ?? null,
            p_lng: p?.lng ?? null,
            p_place_url: p?.url ?? null,
            p_nickname: nick,
            p_password: el.password.value,
          });
          if (typed) store.set("nick", typed);

          f.reset();
          el.nickname.value = typed;
          resetCategory();
          $("catHint").hidden = true;
          $("kres").hidden = true;
          clearPicked();
          setMsg(
            $("addMsg"),
            `'${name}'${josa(name, EUL)} '${nick}' 이름으로 등록했어요.`,
            true,
          );

          // 전체 목록에서 방금 등록한 가게로 스크롤해서 잠깐 강조한다
          clearFilters({ keepNew: true });
          await refresh();
          if (state.view !== "list") setView("list");
          flashRow(newId);
        } catch (err) {
          setMsg($("addMsg"), errText(err));
        } finally {
          btn.disabled = false;
        }
      });

      // =========================================================
      // 11. 카카오 (장소 검색)
      // =========================================================
      let kakaoPlaces = null;
      const baseLatLng = () =>
        new kakao.maps.LatLng(CONFIG.BASE.lat, CONFIG.BASE.lng);

      function loadKakao() {
        if (!CONFIG.KAKAO_JS_KEY) return noKakao();
        const s = document.createElement("script");
        s.src =
          "https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey=" +
          encodeURIComponent(CONFIG.KAKAO_JS_KEY);
        s.onerror = noKakao;
        s.onload = () => {
          if (!window.kakao?.maps) return noKakao();
          kakao.maps.load(() => {
            kakaoPlaces = new kakao.maps.services.Places();
            $("mapTab").hidden = false;
            if (store.get("view") === "map") setView("map"); // 지난번에 지도로 보고 있었으면 지도로 연다
          });
        };
        document.head.appendChild(s);
      }
      // 카카오를 못 쓰면 검색 버튼만 숨기고, 가게 이름 칸은 직접 입력용으로 그대로 둔다
      function noKakao() {
        $("kgo").hidden = true;
        $("kmap").hidden = true;
        $("a_name").type = "text";
        $("a_name").placeholder = "가게 이름";
      }

      // 기준 위치에서 가까운 순으로 이름 검색. 결과가 없으면 빈 배열
      function searchKeyword(keyword, done) {
        const S = kakao.maps.services;
        kakaoPlaces.keywordSearch(
          keyword,
          (data, status) => done(status === S.Status.OK ? data : []),
          {
            location: baseLatLng(),
            radius: 3000,
            sort: S.SortBy.DISTANCE,
          },
        );
      }

      // 가게 추가 폼의 [검색]
      function kakaoSearch() {
        const keyword = $("a_name").value.trim();
        if (!keyword || !kakaoPlaces) return;
        const box = $("kres");
        box.hidden = false;
        box.innerHTML = resultHint("찾는 중…");
        searchKeyword(keyword, (data) => {
          state.kakaoResults = data;
          box.innerHTML = data.length
            ? data.map(placeRow((p) => fmtD(meters(+p.y, +p.x)))).join("")
            : resultHint(
                "검색 결과가 없어요. 이 이름 그대로 등록할 수도 있어요. 이 경우 거리는 표시되지 않아요.",
              );
        });
      }
      $("kgo").addEventListener("click", kakaoSearch);
      $("a_name").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && kakaoPlaces) {
          e.preventDefault();
          kakaoSearch();
        }
      });
      $("kres").addEventListener("click", (e) => {
        const b = e.target.closest(".result[data-i]");
        if (b) pickPlace(state.kakaoResults[Number(b.dataset.i)]);
      });

      function setCategoryFromKakao(p) {
        const path = kakaoPath(p);
        const rule = KAKAO_CATEGORY_RULES.find(([, words]) =>
          words.some((w) => path.includes(w)),
        );
        const category = rule && CATEGORIES.includes(rule[0]) ? rule[0] : "";
        const hint = $("catHint");
        hint.hidden = !path;
        if (!path) return;
        resetCategory(category);
        hint.textContent = category
          ? `카카오 분류 '${path}'에 맞춰 골랐어요`
          : `카카오 분류 '${path}'와 맞는 종류가 없어요. 직접 고르거나 비워 두면 기타로 저장돼요`;
      }

      // 검색 결과나 지도에서 고른 장소를 폼에 채운다
      function pickPlace(p) {
        state.picked = {
          name: p.place_name,
          address: p.road_address_name || p.address_name,
          lat: +p.y,
          lng: +p.x,
          url: p.place_url,
        };
        $("kres").hidden = true;
        $("a_name").value = p.place_name;
        $("picked").hidden = false;
        $("picked").textContent =
          `선택한 위치: ${state.picked.address} · 기준 위치에서 ${fmtD(meters(state.picked.lat, state.picked.lng))}`;
        setCategoryFromKakao(p);
        $("a_menu").focus();
      }
      function clearPicked() {
        state.picked = null;
        $("picked").hidden = true;
      }

      // "기준 위치" 이름표. yAnchor 1.4면 기준점 위에, 0.5면 기준점 한가운데에 놓인다
      function baseLabelOverlay(map, yAnchor) {
        const label = document.createElement("div");
        label.className = "baselabel";
        label.textContent = "기준 위치";
        return new kakao.maps.CustomOverlay({
          map,
          position: baseLatLng(),
          content: label,
          yAnchor,
          zIndex: 2,
        });
      }

      // =========================================================
      // 12. 지도에서 선택 (가게 추가용 팝업)
      // =========================================================
      const picker = { map: null, clickMarker: null, markers: [], places: [] };

      function openPicker() {
        if (!kakaoPlaces) return;
        $("mapModal").hidden = false;
        document.body.style.overflow = "hidden";
        if (!picker.map) {
          picker.map = new kakao.maps.Map($("mapBox"), {
            center: baseLatLng(),
            level: 3,
          });
          baseLabelOverlay(picker.map, 1.4); // 팝업은 기준점에 핀이 있어서 그 위에
          picker.clickMarker = new kakao.maps.Marker({
            position: baseLatLng(),
          });
          kakao.maps.event.addListener(picker.map, "click", (e) =>
            searchNear(e.latLng),
          );
        }
        // 숨겨져 있던 영역에 지도를 그렸으니 크기를 다시 잡는다
        setTimeout(() => {
          picker.map.relayout();
          picker.map.setCenter(baseLatLng());
        }, 0);
        // 가게 이름 칸에 적어 둔 값이 있으면 바로 검색한다
        const typed = $("a_name").value.trim();
        $("mq").value = typed;
        if (typed) searchByName();
        else $("mq").focus();
      }
      function closePicker() {
        $("mapModal").hidden = true;
        document.body.style.overflow = "";
        $("kmap").focus();
      }
      function clearPickerMarkers() {
        picker.markers.forEach((m) => m.setMap(null));
        picker.markers = [];
      }
      function pickerLoading(text) {
        clearPickerMarkers();
        $("mapRes").hidden = false;
        $("mapRes").innerHTML = resultHint(text);
      }

      // 찾은 장소를 목록과 지도에 함께 표시한다. 거리는 검색 기준점(기준 위치 또는 누른 곳)에서 잰 값
      function showPlaces(list, from, fitBounds) {
        picker.places = list;
        $("mapRes").innerHTML = list
          .map(placeRow((p) => `${from} ${fmtD(Number(p.distance))}`))
          .join("");
        const bounds = new kakao.maps.LatLngBounds();
        list.forEach((p, i) => {
          const pos = new kakao.maps.LatLng(+p.y, +p.x);
          const m = new kakao.maps.Marker({
            map: picker.map,
            position: pos,
            title: p.place_name,
            opacity: 0.75,
          });
          kakao.maps.event.addListener(m, "click", () => choosePlace(i));
          picker.markers.push(m);
          bounds.extend(pos);
        });
        if (fitBounds && list.length) picker.map.setBounds(bounds);
      }

      function searchByName() {
        const keyword = $("mq").value.trim();
        if (!keyword) return;
        picker.clickMarker.setMap(null);
        pickerLoading("찾는 중…");
        searchKeyword(keyword, (data) => {
          if (data.length) return showPlaces(data, "기준 위치에서", true);
          $("mapRes").innerHTML = resultHint(
            `'${keyword}'${josa(keyword, RO)} 찾은 가게가 없어요. 이름을 줄이거나 지도에서 직접 눌러 보세요.`,
          );
        });
      }

      // 누른 지점 주변의 음식점(FD6)·카페(CE7)를 함께 찾아 가까운 순으로 보여 준다
      function searchNear(latLng) {
        picker.clickMarker.setPosition(latLng);
        picker.clickMarker.setMap(picker.map);
        pickerLoading("주변 가게를 찾는 중…");

        const S = kakao.maps.services;
        const search = (code) =>
          new Promise((resolve) =>
            kakaoPlaces.categorySearch(
              code,
              (data, status) => resolve(status === S.Status.OK ? data : []),
              { location: latLng, radius: 60, sort: S.SortBy.DISTANCE },
            ),
          );

        Promise.all([search("FD6"), search("CE7")]).then(([food, cafe]) => {
          const found = [...food, ...cafe].sort(
            (a, b) => Number(a.distance) - Number(b.distance),
          );
          if (found.length)
            return showPlaces(found.slice(0, 15), "누른 곳에서", false);
          picker.places = [];
          $("mapRes").innerHTML = resultHint(
            "누른 곳 근처에 등록된 음식점·카페가 없어요. 가게 건물을 조금 더 정확히 눌러 보세요.",
          );
        });
      }

      function choosePlace(i) {
        const p = picker.places[i];
        if (!p) return;
        clearPickerMarkers();
        $("mapRes").hidden = true;
        closePicker();
        pickPlace(p);
      }

      $("kmap").addEventListener("click", openPicker);
      $("mapSearch").addEventListener("submit", (e) => {
        e.preventDefault();
        searchByName();
      });
      $("mapRes").addEventListener("click", (e) => {
        const b = e.target.closest(".result[data-i]");
        if (b) choosePlace(Number(b.dataset.i));
      });
      $("mapModal").addEventListener("click", (e) => {
        if (e.target.closest("[data-close]")) closePicker();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("mapModal").hidden) closePicker();
      });

      // =========================================================
      // 13. 지도로 보기 (등록된 가게 전체)
      // =========================================================
      const allMap = { map: null, markers: [], card: null };

      function setView(v) {
        state.view = v;
        store.set("view", v);
        $("viewTabs")
          .querySelectorAll(".vtab")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.view === v)),
          );
        $("list").hidden = v === "map";
        $("mapView").hidden = v !== "map";
        if (v !== "map") return;
        ensureAllMap();
        // 숨겨져 있던 영역에 지도를 그렸으니 크기를 다시 잡고 핀을 찍는다
        setTimeout(() => {
          allMap.map.relayout();
          updateAllMap();
        }, 0);
      }
      $("viewTabs").addEventListener("click", (e) => {
        const b = e.target.closest(".vtab");
        if (b && b.dataset.view !== state.view) setView(b.dataset.view);
      });

      function ensureAllMap() {
        if (allMap.map) return;
        allMap.map = new kakao.maps.Map($("allMap"), {
          center: baseLatLng(),
          level: 4,
        });
        allMap.map.addControl(
          new kakao.maps.ZoomControl(),
          kakao.maps.ControlPosition.RIGHT,
        );
        baseLabelOverlay(allMap.map, 0.5);
        kakao.maps.event.addListener(allMap.map, "click", closeCard);
      }

      // 지금 목록에 보이는 가게(필터·검색 적용)를 핀으로 찍고, 전부 보이게 범위를 맞춘다
      function updateAllMap() {
        if (!allMap.map) return;
        closeCard();
        allMap.markers.forEach((m) => m.setMap(null));
        allMap.markers = [];

        const rows = visibleRows();
        const withLoc = rows.filter((r) => r.lat != null && r.lng != null);
        const bounds = new kakao.maps.LatLngBounds();
        bounds.extend(baseLatLng());
        for (const r of withLoc) {
          const pos = new kakao.maps.LatLng(r.lat, r.lng);
          const m = new kakao.maps.Marker({
            map: allMap.map,
            position: pos,
            title: r.name,
          });
          kakao.maps.event.addListener(m, "click", () => openCard(r, pos));
          allMap.markers.push(m);
          bounds.extend(pos);
        }
        if (withLoc.length) allMap.map.setBounds(bounds, 40, 40, 40, 40);

        const missing = rows.length - withLoc.length;
        $("mapNote").textContent =
          `지도에 ${withLoc.length}곳` +
          (missing
            ? ` · 위치 정보가 없는 ${missing}곳은 목록에서만 보여요`
            : "") +
          ". 핀을 누르면 가게 정보가 나와요.";
      }

      // 핀을 누르면 뜨는 가게 정보 카드
      function openCard(r, pos) {
        closeCard();
        const tags = colBadge(r) + reportBadge(r);
        const el = document.createElement("div");
        el.className = "mapcard";
        el.innerHTML = `
    <button class="x" type="button" aria-label="닫기">×</button>
    <a class="name" href="${naverUrl(r.name)}" target="_blank" rel="noopener">${esc(r.name)}</a>
    ${tags ? `<span class="tags">${tags}</span>` : ""}
    <span class="menu">${menuLine(r)}</span>
    <span class="dist">${r.price != null ? won(r.price) + " · " : ""}${fmtD(r.d)}</span>
    <span class="mc-actions"><button class="btn link" type="button" data-go>목록에서 보기 · 후기 ${r.review_count}</button></span>`;
        el.querySelector(".x").addEventListener("click", closeCard);
        el.querySelector("[data-go]").addEventListener("click", () => {
          closeCard();
          setView("list");
          flashRow(r.id);
        });
        allMap.card = new kakao.maps.CustomOverlay({
          map: allMap.map,
          position: pos,
          content: el,
          yAnchor: 1,
          zIndex: 5,
          clickable: true,
        });
        allMap.map.panTo(pos);
      }
      function closeCard() {
        if (!allMap.card) return;
        allMap.card.setMap(null);
        allMap.card = null;
      }

      // =========================================================
      // 14. 시작
      // =========================================================
      $("baseLabel").textContent = CONFIG.BASE.label;
      $("baseLink").href = naverUrl(CONFIG.BASE.search);
      resetCategory();
      $("a_nick").value = store.get("nick") || "";

      if (!configured) {
        $("setupBanner").hidden = false;
        $("setupBanner").textContent =
          "아직 Supabase 설정이 안 돼 있어요. index.html 위쪽 CONFIG에 Project URL과 anon key를 넣어 주세요.";
        $("list").innerHTML =
          `<div class="empty">설정을 마치면 가게 목록이 여기에 나와요.</div>`;
        $("toggleAdd").disabled = true;
      } else {
        loadKakao();
        refresh().catch((err) => {
          $("list").innerHTML =
            `<div class="empty">목록을 불러오지 못했어요. ${esc(errText(err))}</div>`;
        });
      }
    </script>
  </body>
</html>
